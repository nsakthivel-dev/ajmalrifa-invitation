  <meta property="og:title" content="Ajmal Ahamed & Rifa Wedding Invitation" />

    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Outfit:wght@300;400;500;600&family=Noto+Serif+Malayalam:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />
  <!-- Single Preload Hint for Background Music -->
  <link rel="preload" href="/audio/music.mp4" as="audio" type="audio/mp4">
</head>

<body class="bg-[#fcfbf9] text-[#2c3e38] antialiased selection:bg-[#d8406b]/20 selection:text-[#d8406b]">
  <script>
    (function () {
      // Metrics tracking
      window.__audioMetrics = {
        requestStartTime: performance.now(),
        timeToPlayableMs: null,
        firstInteractionTime: null,
        interactionToPlaybackMs: null,
        autoplayRejected: null
      };

      // Exactly one persistent HTMLAudioElement
      const music = new Audio("/audio/music.mp4");
      music.preload = "auto";
      music.loop = true;
      music.muted = false;
      music.volume = 0.75;

      music.addEventListener("canplay", function () {
        if (window.__audioMetrics.timeToPlayableMs === null) {
          window.__audioMetrics.timeToPlayableMs = Math.round(
            performance.now() - window.__audioMetrics.requestStartTime
          );
        }
      }, { once: true });

      let started = false;
      let inFlight = false;

      const startEvents = ["pointerdown", "keydown", "touchstart"];

      function removeStartListeners() {
        startEvents.forEach(function (evt) {
          window.removeEventListener(evt, onFirstInteraction, true);
          document.removeEventListener(evt, onFirstInteraction, true);
        });
      }

      function tryStartMusic() {
        if (started || inFlight) return;

        inFlight = true;
        const playPromise = music.play();

        if (playPromise) {
          playPromise
            .then(function () {
              started = true;
              inFlight = false;
              if (window.__audioMetrics.autoplayRejected === null) {
                window.__audioMetrics.autoplayRejected = false;
              }
              if (window.__audioMetrics.firstInteractionTime && window.__audioMetrics.interactionToPlaybackMs === null) {
                window.__audioMetrics.interactionToPlaybackMs = Math.round(
                  performance.now() - window.__audioMetrics.firstInteractionTime
                );
              }
              removeStartListeners();
              if (typeof window.onAudioStateChange === "function") {
                window.onAudioStateChange(true);
              }
            })
            .catch(function (error) {
              inFlight = false;
              if (window.__audioMetrics.autoplayRejected === null) {
                window.__audioMetrics.autoplayRejected = true;
              }
              console.warn("Background music could not start yet:", error.name, error.message);
              // Keep listeners active so a later permitted interaction can retry.
            });
        } else {
          inFlight = false;
        }
      }

      function onFirstInteraction() {
        if (window.__audioMetrics.firstInteractionTime === null) {
          window.__audioMetrics.firstInteractionTime = performance.now();
        }
        tryStartMusic();
      }

      startEvents.forEach(function (evt) {
        window.addEventListener(evt, onFirstInteraction, true);
        document.addEventListener(evt, onFirstInteraction, true);
      });

      // Attempt audible play once at startup
      tryStartMusic();

      // Expose single instance and controls
      window.__bgMusic = music;
      window.playBackgroundMusic = tryStartMusic;
      window.toggleBackgroundMusic = function () {
        if (music.paused) {
          music.play().then(function () {
            started = true;
            removeStartListeners();
            if (typeof window.onAudioStateChange === "function") {
              window.onAudioStateChange(true);
            }
          }).catch(function (err) {
            console.warn("Could not resume audio:", err);
          });
        } else {
          music.pause();
          if (typeof window.onAudioStateChange === "function") {
            window.onAudioStateChange(false);
          }
        }
      };
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
