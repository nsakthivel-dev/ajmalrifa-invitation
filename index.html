<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajmal Ahamed & Rifa Wedding Invitation</title>
  <meta name="description"
    content="Together with our families, we invite you to celebrate the wedding of Ajmal Ahamed and Rifa." />
  <meta property="og:title" content="Ajmal Ahamed & Rifa Wedding Invitation" />
  <meta property="og:description"
    content="Join us as we celebrate our love. View our interactive wedding invitation." />
  <meta property="og:image" content="/wedding/nithya_arun.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Outfit:wght@300;400;500;600&family=Noto+Serif+Malayalam:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />
  <!-- Preload Background Audio for Instant Zero-Delay Playback -->
  <link rel="preload" href="/audio/dheema.mp4" as="audio" type="audio/mp4" />
</head>

<body class="bg-[#fcfbf9] text-[#2c3e38] antialiased selection:bg-[#d8406b]/20 selection:text-[#d8406b]">
  <!-- Background Audio Player: Auto plays unmuted & loops seamlessly -->
  <audio
    id="bg-music"
    src="/audio/dheema.mp4"
    autoplay
    loop
    preload="auto"
    playsinline
    style="display: none;"
  ></audio>
  <script>
    (function () {
      const audio = document.getElementById("bg-music");
      if (!audio) return;
      audio.muted = false;
      audio.loop = true;
      audio.volume = 1.0;

      const userGestureEvents = [
        "pointerdown",
        "pointerup",
        "touchstart",
        "touchend",
        "touchmove",
        "click",
        "keydown",
        "mousedown",
        "mouseup",
        "scroll",
        "wheel",
        "mousemove"
      ];

      const startAudio = function () {
        if (!audio) return;
        audio.muted = false;
        audio.volume = 1.0;
        if (audio.paused) {
          const p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              cleanup();
            }).catch(function () {});
          }
        } else {
          cleanup();
        }
      };

      function cleanup() {
        userGestureEvents.forEach(function (evt) {
          window.removeEventListener(evt, startAudio, true);
          document.removeEventListener(evt, startAudio, true);
        });
      }

      userGestureEvents.forEach(function (evt) {
        window.addEventListener(evt, startAudio, { capture: true, passive: true });
        document.addEventListener(evt, startAudio, { capture: true, passive: true });
      });

      audio.addEventListener("playing", cleanup, { once: true });
      audio.addEventListener("canplay", startAudio, { once: true });
      audio.addEventListener("canplaythrough", startAudio, { once: true });
      audio.addEventListener("loadeddata", startAudio, { once: true });

      // Immediate attempt on script execution & all lifecycle events
      startAudio();
      document.addEventListener("DOMContentLoaded", startAudio);
      window.addEventListener("load", startAudio);
      window.addEventListener("pageshow", startAudio);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && audio.paused) startAudio();
      });
      window.addEventListener("focus", function () {
        if (audio.paused) startAudio();
      });
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
