<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />

  <meta name="description"
    content="Together with our families, we invite you to celebrate the wedding of Ajmal Ahamed and Rifa." />
  <meta property="og:title" content="Ajmal Ahamed & Rifa Wedding Invitation" />
  <meta property="og:description"
    content="Join us as we celebrate our love. View our interactive wedding invitation." />
  <meta property="og:image" content="/wedding/nithya_arun.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Outfit:wght@300;400;500;600&family=Noto+Serif+Malayalam:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />
  <!-- Preload Background Audio for Instant Zero-Delay Playback -->
    <link rel="preload" href="/audio/audio.mp3" as="audio" type="audio/mpeg" />
  <link rel="preload" href="/audio/audio.mp4" as="audio" type="audio/mp4" />
</head>

<body class="bg-[#fcfbf9] text-[#2c3e38] antialiased selection:bg-[#d8406b]/20 selection:text-[#d8406b]">
  <!-- Background Audio Player: Auto plays unmuted & loops seamlessly -->
  <audio
    id="bg-music"
    src="/audio/audio.mp3"
    loop
    preload="auto"
    playsinline
    webkit-playsinline="true"
    style="display: none;"
  >
    <source src="/audio/audio.mp3" type="audio/mpeg" />
    <source src="/audio/audio.mp4" type="audio/mp4" />
  </audio>
  <script>
    (function () {
      const audio = document.getElementById("bg-music");
      if (!audio) return;
      audio.muted = false;
      audio.loop = true;
      audio.volume = 1.0;

      let isStarting = false;

      // Only listen to discrete user gestures that grant audio playback permission.
      // Do NOT listen to touchmove, mousemove, or scroll, as they fire at 60-120Hz
      // and cause rapid-fire play() calls resulting in audio stutter on mobile hardware.
      const gestureEvents = [
        "pointerdown",
        "touchstart",
        "touchend",
        "click",
        "keydown"
      ];

      function cleanupListeners() {
        gestureEvents.forEach(function (evt) {
          window.removeEventListener(evt, handleGesture, true);
          document.removeEventListener(evt, handleGesture, true);
        });
      }

      function startAudio() {
        if (!audio || !audio.paused || isStarting) return;
        audio.muted = false;
        audio.volume = 1.0;
        isStarting = true;

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(function () {
              isStarting = false;
              cleanupListeners();
            })
            .catch(function () {
              isStarting = false;
            });
        } else {
          isStarting = false;
        }
      }

      function handleGesture() {
        cleanupListeners();
        startAudio();
      }

      gestureEvents.forEach(function (evt) {
        window.addEventListener(evt, handleGesture, { capture: true, passive: true });
        document.addEventListener(evt, handleGesture, { capture: true, passive: true });
      });

      audio.addEventListener("playing", cleanupListeners, { once: true });
      audio.addEventListener("ended", function () {
        audio.currentTime = 0;
        audio.play().catch(function () {});
      });

      // Immediate attempt on script execution & browser lifecycle events
      startAudio();
      document.addEventListener("DOMContentLoaded", startAudio, { once: true });
      window.addEventListener("load", startAudio, { once: true });
      window.addEventListener("pageshow", startAudio);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && audio.paused) startAudio();
      });
      window.addEventListener("focus", function () {
        if (audio.paused) startAudio();
      });
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
