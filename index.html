<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajmal Ahamed & Rifa Wedding Invitation</title>
  <meta name="description"
    content="Together with our families, we invite you to celebrate the wedding of Ajmal Ahamed and Rifa." />
  <meta property="og:title" content="Ajmal Ahamed & Rifa Wedding Invitation" />
  <meta property="og:description"
    content="Join us as we celebrate our love. View our interactive wedding invitation." />
  <meta property="og:image" content="/wedding/nithya_arun.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Noto+Serif+Malayalam:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-[#fcfbf9] text-[#2c3e38] antialiased selection:bg-[#d8406b]/20 selection:text-[#d8406b]">
  <!-- Background Audio Player: Initialized as early as practical during page load -->
  <audio
    id="bg-music"
    src="/audio/dheema.mp4"
    loop
    preload="auto"
    playsinline
    style="display: none;"
  ></audio>
  <script>
    (function () {
      const audio = document.getElementById("bg-music");
      if (!audio) return;
      const tryPlay = () => {
        const p = audio.play();
        if (p !== undefined) {
          p.then(() => removeInteractionListeners()).catch(() => {});
        }
      };
      const onUserInteraction = () => {
        tryPlay();
      };
      const interactionEvents = ["pointerdown", "touchstart", "click", "keydown", "wheel", "scroll"];
      const removeInteractionListeners = () => {
        interactionEvents.forEach((evt) => {
          window.removeEventListener(evt, onUserInteraction);
        });
      };
      interactionEvents.forEach((evt) => {
        window.addEventListener(evt, onUserInteraction, { once: true, passive: true });
      });
      tryPlay();
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
