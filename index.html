<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajmal Ahamed & Rifa Wedding Invitation</title>
  <meta name="description"
    content="Together with our families, we invite you to celebrate the wedding of Ajmal Ahamed and Rifa." />
  <meta property="og:title" content="Ajmal Ahamed & Rifa Wedding Invitation" />
  <meta property="og:description"
    content="Join us as we celebrate our love. View our interactive wedding invitation." />
  <meta property="og:image" content="/wedding/nithya_arun.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Outfit:wght@300;400;500;600&family=Noto+Serif+Malayalam:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />
  <!-- Preload Background Audio for Instant Zero-Delay Playback -->
  <link rel="preload" href="/audio/audio.mp3" as="audio" type="audio/mpeg" />
</head>

<body class="bg-[#fcfbf9] text-[#2c3e38] antialiased selection:bg-[#d8406b]/20 selection:text-[#d8406b]">
  <!-- Background Audio Player: Single global instance, unmuted, continuous loop -->
  <audio
    id="bg-music"
    src="/audio/audio.mp3"
    loop
    preload="auto"
    playsinline
    webkit-playsinline="true"
    style="display: none;"
  ></audio>
  <script>
    (function () {
      var audio = document.getElementById("bg-music");
      if (!audio) return;

      audio.muted = false;
      audio.defaultMuted = false;
      audio.volume = 1.0;
      audio.playbackRate = 1.0;
      audio.loop = true;

      var isPlaying = false;
      var activationEvents = [
        "pointerdown",
        "touchstart",
        "touchend",
        "click",
        "keydown"
      ];

      function removeActivationHandlers() {
        activationEvents.forEach(function (evt) {
          window.removeEventListener(evt, onFirstInteraction, true);
          document.removeEventListener(evt, onFirstInteraction, true);
        });
      }

      function startPlayback() {
        if (!audio) return;
        if (!audio.paused) {
          isPlaying = true;
          removeActivationHandlers();
          return;
        }

        audio.muted = false;
        audio.volume = 1.0;
        audio.playbackRate = 1.0;

        var playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(function () {
              isPlaying = true;
              removeActivationHandlers();
            })
            .catch(function () {
              // Autoplay blocked by browser policy; user interaction will trigger playback
            });
        }
      }

      function onFirstInteraction() {
        startPlayback();
      }

      activationEvents.forEach(function (evt) {
        window.addEventListener(evt, onFirstInteraction, true);
        document.addEventListener(evt, onFirstInteraction, true);
      });

      audio.addEventListener("ended", function () {
        audio.currentTime = 0;
        audio.play().catch(function () {});
      });

      audio.addEventListener("playing", function () {
        isPlaying = true;
        removeActivationHandlers();
      }, { once: true });

      window.playBackgroundMusic = startPlayback;

      // 1. Attempt immediate audible autoplay on script execution
      startPlayback();

      // Lifecycle event attempts
      document.addEventListener("DOMContentLoaded", startPlayback, { once: true });
      window.addEventListener("load", startPlayback, { once: true });
      window.addEventListener("pageshow", startPlayback);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && audio.paused) {
          startPlayback();
        }
      });
      window.addEventListener("focus", function () {
        if (audio.paused) {
          startPlayback();
        }
      });
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
